<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Hệ Thống Check-in BTC</title>
		<style>
			body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
			.card { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 380px; width: 90%; box-sizing: border-box; }
			.success { color: #2e7d32; }
			.error { color: #c62828; }
			.info { font-size: 18px; margin: 10px 0; color: #333; }
			.loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
			@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

			/* Hiển thị ID thiết bị */
			.device-label { font-size: 14px; color: #666; margin: 15px 0 5px; }
			.device-id { font-family: Consolas, 'Courier New', monospace; font-size: 22px; font-weight: bold; letter-spacing: 1px; color: #1565c0; background: #e3f2fd; padding: 10px; border-radius: 6px; user-select: all; word-break: break-all; }
			.device-small { font-size: 12px; color: #999; margin-top: 20px; }
			button { background-color: #1565c0; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
			button:hover { background-color: #0d47a1; }
			.btn-big { width: 100%; padding: 14px; font-size: 18px; }

			/* Chế độ quét QR */
			.scan-title { color: #1565c0; margin: 0 0 12px; font-size: 20px; }
			/* Khung vuông: video phủ kín (object-fit: cover) -> phần nhìn thấy = hình vuông ở giữa khung hình camera */
			#reader { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: #000; }
			#video { width: 100%; height: 100%; object-fit: cover; display: block; }
			/* Ô ngắm = đúng vùng được giải mã (SCAN_FRACTION của cạnh ngắn) */
			.scan-frame { position: absolute; left: 50%; top: 50%; width: 80%; height: 80%; transform: translate(-50%, -50%); border: 3px solid rgba(255,255,255,0.9); border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.3); pointer-events: none; }
			.scan-hint { font-size: 14px; color: #666; margin: 12px 0 0; }
			.hidden { display: none !important; }

			/* Điều khiển camera: chọn camera + zoom */
			.cam-controls { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
			.cam-controls select { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
			.zoom-wrap { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #333; }
			.zoom-wrap input { flex: 1; }
			.zoom-val { min-width: 38px; text-align: right; font-weight: bold; color: #1565c0; }
			.scan-tip { font-size: 12px; color: #999; margin: 8px 0 0; }
		</style>
	</head>
	<body>

		<div class="card">
			<!-- Khu vực quét QR (giữ nguyên trong DOM để camera không phải khởi động lại) -->
			<div id="scanner" class="hidden">
				<h2 class="scan-title">📷 Quét mã QR check-in</h2>
				<div id="reader">
					<video id="video" playsinline muted autoplay></video>
					<div class="scan-frame"></div>
				</div>
				<p class="scan-hint" id="scan-hint">Đang mở camera...</p>
				<div class="cam-controls">
					<div class="zoom-wrap hidden" id="zoom-wrap">
						<span>🔍 Zoom</span>
						<input type="range" id="zoom" min="1" max="1" step="0.1" value="1">
						<span class="zoom-val" id="zoom-val">1x</span>
					</div>
					<select id="camera-select" class="hidden" aria-label="Chọn camera"></select>
				</div>
				<p class="scan-tip">Mã QR nhỏ: giữ máy cách 15–25 cm rồi tăng zoom, chạm vào hình để lấy nét lại, hoặc thử camera khác.</p>
			</div>

			<!-- Khu vực hiển thị kết quả -->
			<div id="box">
				<div class="loader"></div>
				<p>Đang xác thực thiết bị...</p>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
		<script>
			const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyA2sQ2wTgO9ELiw-AC6QTY3cnvXlRkl8lqmlaxOq_D8-6W-KtXZ8eRlWlciS1g4oh-Ng/exec"; // Dán đúng URL Web App (/exec)
			const SECRET_KEY = "HANA2026";
			const DEVICE_KEY = 'BTC_DEVICE_ID';
			const REQUEST_TIMEOUT_MS = 25000; // Apps Script "khởi động nguội" có thể mất vài giây

			const urlParams = new URLSearchParams(window.location.search);
			const token = urlParams.get('token');
			const box = document.getElementById('box');
			const scannerEl = document.getElementById('scanner');
			const scanHint = document.getElementById('scan-hint');

			function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
			function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
			function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

			// Lấy (hoặc tạo mới) ID thiết bị, lưu cố định trên trình duyệt của máy.
			// Dạng: BTC-XXXX-XXXX (bỏ các ký tự dễ nhầm như 0/O, 1/I/L).
			function getDeviceId() {
				let id = lsGet(DEVICE_KEY);
				if (id) return id;

				const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
				const bytes = new Uint8Array(8);
				crypto.getRandomValues(bytes);
				let s = '';
				for (let i = 0; i < bytes.length; i++) s += chars[bytes[i] % chars.length];
				id = 'BTC-' + s.slice(0, 4) + '-' + s.slice(4);

				lsSet(DEVICE_KEY, id);
				return id;
			}
			const deviceId = getDeviceId();

			// Hàm giải mã Token
			function decodeToken(tokenStr) {
				try {
					let base64 = tokenStr.replace(/-/g, '+').replace(/_/g, '/');
					while (base64.length % 4) { base64 += '='; }
					let decoded = atob(base64);
					let parts = decoded.split('_');
					if (parts[0] === SECRET_KEY && parts[1]) {
						return parts[1];
					}
					return null;
				} catch (e) {
					return null;
				}
			}

			// Lấy token từ nội dung mã QR (QR chứa link .../?token=..., hoặc chỉ chứa token)
			function tokenFromQrText(text) {
				text = (text || '').trim();
				try {
					const t = new URL(text).searchParams.get('token');
					if (t) return t;
				} catch (e) {}
				return text;
			}

			function deviceFooter() {
				return `<div class="device-small">ID thiết bị: ${deviceId}</div>`;
			}

			function scanNextButton() {
				return `<button class="btn-big" onclick="startScanMode()">📷 Quét mã tiếp</button>`;
			}

			function showResult(html) {
				scannerEl.classList.add('hidden');
				box.classList.remove('hidden');
				box.innerHTML = html;
			}

			// Hiển thị khi thiết bị chưa được cấp quyền trong tab "Thiết bị BTC"
			function showNoPermission() {
				showResult(`
					<h2 class="error" style="margin-top: 0;">Không có quyền check-in</h2>
					<div class="device-label">ID thiết bị:</div>
					<div class="device-id" id="deviceIdText">${deviceId}</div>
					<button onclick="copyDeviceId()" id="copyBtn">Sao chép ID</button>
					${scanNextButton()}
				`);
			}

			function copyDeviceId() {
				const btn = document.getElementById('copyBtn');
				const done = () => { btn.textContent = 'Đã sao chép!'; };
				if (navigator.clipboard && window.isSecureContext) {
					navigator.clipboard.writeText(deviceId).then(done).catch(() => {});
				} else {
					const range = document.createRange();
					range.selectNodeContents(document.getElementById('deviceIdText'));
					const sel = window.getSelection();
					sel.removeAllRanges();
					sel.addRange(range);
					try { document.execCommand('copy'); done(); } catch (e) {}
				}
			}

			function vibrate(pattern) {
				try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
			}

			// ==================== GỌI CHECK-IN VỀ APPS SCRIPT (JSONP) ====================
			let pending = null; // { timer, script } của yêu cầu đang chờ

			function finishPending() {
				if (!pending) return false;
				clearTimeout(pending.timer);
				pending.script.remove();
				pending = null;
				return true;
			}

			// Hàm xử lý dữ liệu trả về từ Apps Script
			function handleResponse(data) {
				if (!finishPending()) return; // Bỏ qua phản hồi đến muộn (đã báo lỗi quá thời gian)

				if (data.status === "success") {
					vibrate(150);
					showResult(`
						<h1 class="success" style="margin: 0 0 5px;">✓ Check-in Thành Công!</h1>
						<hr style="border: 0.5px solid #eee; margin: 15px 0;">
						<div class="info">
							<b>Mã ID:</b> ${data.id}
						</div>
						<div class="info">
							<b>Họ và tên:</b>
							<span style="color: #1565c0;">${data.name || '(Chưa nhập tên)'}</span>
						</div>
						<div class="info">
							<b>Bàn:</b>
							<span style="color: #1565c0;">${data.table || '(Chưa nhập bàn)'}</span>
						</div>
						${scanNextButton()}
						${deviceFooter()}
					`);
				} else if (data.status === "unauthorized") {
					vibrate([100, 80, 100]);
					showNoPermission();
				} else {
					vibrate([100, 80, 100]);
					showResult(`
						<h2 class="error" style="margin-top: 0;">${data.message}</h2>
						${scanNextButton()}
						${deviceFooter()}
					`);
				}
			}

			// Gửi check-in cho một ID khách (gửi kèm ID thiết bị thay cho mật khẩu)
			function processCheckin(realId) {
				if (!realId) {
					vibrate([100, 80, 100]);
					showResult(`<h2 class="error" style="margin-top: 0;">Mã QR không hợp lệ!</h2>${scanNextButton()}${deviceFooter()}`);
					return;
				}

				showResult(`<div class="loader"></div><p>Đang check-in...</p>`);
				finishPending();

				const script = document.createElement('script');
				script.src = `${SCRIPT_URL}?id=${encodeURIComponent(realId)}&device=${encodeURIComponent(deviceId)}&callback=handleResponse`;
				const fail = function() {
					if (!finishPending()) return;
					showResult(`<h2 class="error" style="margin-top: 0;">Có lỗi kết nối máy chủ!</h2>${scanNextButton()}`);
				};
				script.onerror = fail;
				pending = { script: script, timer: setTimeout(fail, REQUEST_TIMEOUT_MS) };
				document.body.appendChild(script);
			}

			// ==================== CHẾ ĐỘ QUÉT QR BẰNG CAMERA ====================
			// Tự đọc khung hình camera ở ĐỘ PHÂN GIẢI GỐC (không thu nhỏ theo kích thước màn hình)
			// để QR nhỏ vẫn đủ chi tiết. Ưu tiên BarcodeDetector có sẵn của trình duyệt
			// (Android Chrome), nếu không có thì dùng jsQR.
			const CAMERA_KEY = 'BTC_CAMERA_ID';   // camera đã chọn trên máy này
			const ZOOM_KEY = 'BTC_CAMERA_ZOOM';   // mức zoom đã chọn
			const SCAN_FRACTION = 0.8;            // vùng giải mã = 80% cạnh ngắn (khớp .scan-frame)
			const MAX_DECODE_SIDE = 1000;         // giới hạn kích thước ảnh đưa vào jsQR (tốc độ)
			const SCAN_INTERVAL_MS = 80;

			const video = document.getElementById('video');
			const zoomWrap = document.getElementById('zoom-wrap');
			const zoomInput = document.getElementById('zoom');
			const zoomVal = document.getElementById('zoom-val');
			const cameraSelect = document.getElementById('camera-select');
			const decodeCanvas = document.createElement('canvas');
			const decodeCtx = decodeCanvas.getContext('2d', { willReadFrequently: true });

			let stream = null;      // MediaStream đang chạy
			let track = null;       // video track đang chạy
			let trackCaps = {};     // khả năng của camera (zoom, focusMode...)
			let busy = true;        // true = không giải mã (đang xử lý kết quả / camera chưa sẵn sàng)
			let loopTimer = null;
			let detector = null;    // BarcodeDetector nếu trình duyệt hỗ trợ QR

			async function initDetector() {
				try {
					if ('BarcodeDetector' in window) {
						const formats = await BarcodeDetector.getSupportedFormats();
						if (formats.indexOf('qr_code') !== -1) detector = new BarcodeDetector({ formats: ['qr_code'] });
					}
				} catch (e) { detector = null; }
			}

			// Yêu cầu camera độ phân giải cao (QR nhỏ cần nhiều điểm ảnh) + tự lấy nét liên tục.
			function buildVideoConstraints() {
				const c = {
					width: { ideal: 1920 },
					height: { ideal: 1080 },
					advanced: [{ focusMode: 'continuous' }]
				};
				const savedId = lsGet(CAMERA_KEY);
				if (savedId) c.deviceId = { exact: savedId };
				else c.facingMode = { ideal: 'environment' };
				return c;
			}

			function applyConstraint(obj) {
				if (!track || !track.applyConstraints) return Promise.resolve();
				return track.applyConstraints({ advanced: [obj] }).catch(function() {});
			}

			// Sau khi camera chạy: bật lấy nét liên tục, hiện thanh zoom nếu máy hỗ trợ.
			function enhanceCamera() {
				trackCaps = {};
				try { trackCaps = (track.getCapabilities && track.getCapabilities()) || {}; } catch (e) {}

				const focusModes = trackCaps.focusMode || [];
				if (focusModes.indexOf('continuous') !== -1) applyConstraint({ focusMode: 'continuous' });

				const z = trackCaps.zoom;
				if (z && typeof z.max === 'number' && z.max > z.min) {
					const max = Math.min(z.max, 8); // trên 8x thường quá nhiễu
					zoomInput.min = z.min;
					zoomInput.max = max;
					zoomInput.step = z.step || 0.1;
					let v = parseFloat(lsGet(ZOOM_KEY));
					if (!(v >= z.min && v <= max)) v = z.min;
					zoomInput.value = v;
					showZoom(v);
					if (v !== z.min) applyConstraint({ zoom: v });
					zoomWrap.classList.remove('hidden');
				} else {
					zoomWrap.classList.add('hidden');
				}
			}

			function showZoom(v) { zoomVal.textContent = (Math.round(v * 10) / 10) + 'x'; }

			zoomInput.addEventListener('input', function() {
				const v = parseFloat(zoomInput.value);
				showZoom(v);
				applyConstraint({ zoom: v });
				lsSet(ZOOM_KEY, String(v));
			});

			// Chạm vào hình camera để lấy nét lại (Android Chrome hỗ trợ; máy khác bỏ qua).
			document.getElementById('reader').addEventListener('click', function() {
				const modes = trackCaps.focusMode || [];
				if (modes.indexOf('single-shot') === -1) return;
				applyConstraint({ focusMode: 'single-shot' }).then(function() {
					if (modes.indexOf('continuous') !== -1) setTimeout(function() { applyConstraint({ focusMode: 'continuous' }); }, 1500);
				});
				scanHint.textContent = 'Đang lấy nét...';
				setTimeout(function() { if (track && !busy) scanHint.textContent = 'Đưa mã QR vào khung để check-in'; }, 1500);
			});

			// Danh sách camera: nhiều điện thoại có 2–4 camera sau; camera mặc định có thể
			// là camera góc rộng không lấy nét gần được. Cho BTC chọn camera khác.
			async function fillCameraList() {
				try {
					const cams = (await navigator.mediaDevices.enumerateDevices()).filter(function(d) { return d.kind === 'videoinput'; });
					if (cams.length < 2) { cameraSelect.classList.add('hidden'); return; }
					let currentId = null;
					try { currentId = track.getSettings().deviceId; } catch (e) {}
					cameraSelect.innerHTML = '';
					cams.forEach(function(cam, i) {
						const opt = document.createElement('option');
						opt.value = cam.deviceId;
						opt.textContent = '📷 ' + (cam.label || ('Camera ' + (i + 1)));
						if (cam.deviceId === currentId) opt.selected = true;
						cameraSelect.appendChild(opt);
					});
					cameraSelect.classList.remove('hidden');
				} catch (e) { cameraSelect.classList.add('hidden'); }
			}

			cameraSelect.addEventListener('change', function() {
				lsSet(CAMERA_KEY, cameraSelect.value);
				lsDel(ZOOM_KEY); // mỗi camera có dải zoom khác nhau
				stopCamera();
				startCamera();
			});

			function stopCamera() {
				busy = true;
				clearTimeout(loopTimer);
				if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
				stream = null;
				track = null;
				video.srcObject = null;
			}

			async function startCamera() {
				scanHint.textContent = 'Đang mở camera...';
				zoomWrap.classList.add('hidden');
				if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
					showCameraError('Trình duyệt không hỗ trợ camera');
					return;
				}
				try {
					stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: buildVideoConstraints() });
				} catch (err) {
					// Camera đã lưu không còn (đổi máy/cập nhật) -> thử lại với camera sau mặc định
					if (lsGet(CAMERA_KEY) && err && (err.name === 'OverconstrainedError' || err.name === 'NotFoundError' || err.name === 'NotReadableError')) {
						lsDel(CAMERA_KEY);
						lsDel(ZOOM_KEY);
						return startCamera();
					}
					showCameraError(err);
					return;
				}
				track = stream.getVideoTracks()[0];
				video.srcObject = stream;
				try { await video.play(); } catch (e) {}
				scanHint.textContent = 'Đưa mã QR vào khung để check-in';
				enhanceCamera();
				fillCameraList();
				busy = false;
				scheduleScan(0);
			}

			function scheduleScan(delay) {
				clearTimeout(loopTimer);
				loopTimer = setTimeout(scanFrame, delay);
			}

			async function scanFrame() {
				if (busy || !track) return;
				const vw = video.videoWidth, vh = video.videoHeight;
				if (!vw || !vh || video.readyState < 2) { scheduleScan(100); return; }

				let text = null;
				try {
					if (detector) {
						const codes = await detector.detect(video);
						if (codes && codes.length) text = codes[0].rawValue;
					} else {
						// Cắt hình vuông ở giữa (đúng ô ngắm) từ khung hình gốc, giữ nguyên độ phân giải
						const side = Math.floor(Math.min(vw, vh) * SCAN_FRACTION);
						const sx = Math.floor((vw - side) / 2), sy = Math.floor((vh - side) / 2);
						const out = Math.min(side, MAX_DECODE_SIDE);
						if (decodeCanvas.width !== out) { decodeCanvas.width = out; decodeCanvas.height = out; }
						decodeCtx.drawImage(video, sx, sy, side, side, 0, 0, out, out);
						const img = decodeCtx.getImageData(0, 0, out, out);
						const code = jsQR(img.data, out, out, { inversionAttempts: 'dontInvert' });
						if (code && code.data) text = code.data;
					}
				} catch (e) {
					// BarcodeDetector lỗi trên máy này -> chuyển sang jsQR
					if (detector) detector = null;
				}

				if (busy) return; // người dùng đã rời chế độ quét trong lúc giải mã
				if (text) { onScanSuccess(text); return; }
				scheduleScan(SCAN_INTERVAL_MS);
			}

			let lastText = null;    // mã vừa quét
			let ignoreUntil = 0;    // bỏ qua mã vừa quét trong vài giây sau khi bấm "Quét mã tiếp"

			function onScanSuccess(text) {
				if (busy) return;
				if (text === lastText && Date.now() < ignoreUntil) { scheduleScan(SCAN_INTERVAL_MS); return; }
				lastText = text;
				busy = true;
				clearTimeout(loopTimer);
				processCheckin(decodeToken(tokenFromQrText(text)));
			}

			function showCameraError(err) {
				stopCamera();
				scanHint.innerHTML = `<span class="error"><b>Không mở được camera.</b><br>Hãy cho phép trang truy cập camera rồi thử lại.</span>`
					+ `<br><button onclick="startScanMode()">Thử lại</button>`;
				console.error(err);
			}

			async function startScanMode() {
				// Bỏ ?token=... khỏi địa chỉ để tải lại trang không check-in lại khách cũ
				if (window.location.search) {
					history.replaceState(null, '', window.location.pathname);
				}

				box.classList.add('hidden');
				scannerEl.classList.remove('hidden');

				if (typeof jsQR === 'undefined') {
					showCameraError('Không tải được thư viện quét QR');
					return;
				}

				// Camera vẫn đang chạy từ lần quét trước -> chỉ cần quét tiếp
				if (track && track.readyState === 'live') {
					scanHint.textContent = 'Đưa mã QR vào khung để check-in';
					ignoreUntil = Date.now() + 3000; // mã của khách vừa quét có thể vẫn còn trước camera
					busy = false;
					scheduleScan(0);
					return;
				}

				if (!detector) await initDetector();
				startCamera();
			}

			// Dọn mật khẩu cũ (không còn dùng) nếu còn lưu trên máy
			lsDel('BTC_CHECKIN_PASS');

			// KIỂM TRA LUỒNG CHẠY BAN ĐẦU:
			// - Mở từ link trong QR (có ?token=) -> check-in ngay khách đó.
			// - Mở trang không có token -> vào chế độ quét QR bằng camera.
			if (token) {
				processCheckin(decodeToken(token));
			} else {
				startScanMode();
			}
		</script>

	</body>
</html>
