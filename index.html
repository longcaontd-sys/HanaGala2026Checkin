<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Check-in</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 90%; }
    .success { color: #2e7d32; }
    .error { color: #c62828; }
    .info { font-size: 18px; margin: 10px 0; color: #333; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card" id="box">
  <div class="loader" id="loader"></div>
  <p id="status-text">Đang xử lý Check-in...</p>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJdkQuMz-uumPCoh76BY-N20ULDb25Bwh8QL1yKXJzqDWzS1dUfaz8cSR_Aiqitv6QOA/exec"; 
  const SECRET_KEY = "HANA2026"; // Phải trùng với chuỗi bí mật ở Apps Script

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const box = document.getElementById('box');

  // Hàm giải mã Token để lấy lại ID gốc
  function decodeToken(tokenStr) {
    try {
      // Decode Base64 (Xử lý hỗ trợ URL Safe)
      let base64 = tokenStr.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) { base64 += '='; }
      let decoded = atob(base64);
      
      let parts = decoded.split('_');
      if (parts[0] === SECRET_KEY && parts[1]) {
        return parts[1]; // Trả về ID thật
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  function handleResponse(data) {
    if (data.status === "success") {
      box.innerHTML = `
        <h1 class="success" style="margin-bottom: 5px;">✓ Check-in Thành Công!</h1>
        <hr style="border: 0.5px solid #eee; margin: 15px 0;">
        <div class="info"><b>Mã ID:</b> ${data.id}</div>
        <div class="info"><b>Họ và tên:</b> <span style="color: #1565c0;">${data.name || '(Chưa nhập tên)'}</span></div>
      `;
    } else {
      box.innerHTML = `<h2 class="error">${data.message}</h2>`;
    }
  }

  const realId = token ? decodeToken(token) : null;

  if (!realId) {
    box.innerHTML = `<h2 class="error">Mã QR không hợp lệ hoặc đã bị thay đổi!</h2>`;
  } else {
    // Gửi ID đã giải mã tới Apps Script
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?id=${encodeURIComponent(realId)}&callback=handleResponse`;
    script.onerror = function() {
      box.innerHTML = `<h2 class="error">Có lỗi kết nối máy chủ!</h2>`;
    };
    document.body.appendChild(script);
  }
</script>

</body>
</html>
